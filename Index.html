<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Antijuda</title>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antijuda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

      href="https://i.postimg.cc/7LmDNT8W/8f4199dd-a211-4077-8132-1af991b36646.jpg">

<style>
*,
*::before,
*::after{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --electric:#00a8ff;
    --electric-light:#00d9ff;
    --electric-dark:#0066ff;
    --blue-glow:rgba(0,168,255,.45);

    --bg:#000000;
    --card:rgba(8,10,14,.94);
    --border:rgba(0,168,255,.35);

    --text:#f5f7fa;
    --muted:#9ca3af;
    --dim:#68707d;

    --item:rgba(2,8,14,.70);
    --item-border:rgba(0,168,255,.25);
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
}

/* =========================
   FUNDO ANIMADO
========================= */

.animated-bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(0,168,255,.10),
            transparent 38%
        ),
        #000;
}

#neuralCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.background-logo{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(70vw,330px);
    height:min(70vw,330px);
    border-radius:50%;
    overflow:hidden;
    opacity:.075;
    filter:drop-shadow(0 0 35px rgba(0,168,255,.8));
    pointer-events:none;
}

.background-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.neural-title{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(30px,10vw,80px);
    font-weight:900;
    color:rgba(0,168,255,.08);
    letter-spacing:8px;
    text-transform:uppercase;
    pointer-events:none;
    white-space:nowrap;
}

/* =========================
   LOADING
========================= */

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    transition:opacity .6s ease;
}

#loadingScreen.fade-out{
    opacity:0;
    pointer-events:none;
}

.loader-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}

.loader-logo{
    width:115px;
    height:115px;
    border-radius:50%;
    overflow:hidden;
    animation:logoPulse 1.8s ease-in-out infinite;
}

.loader-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.loader-ring{
    width:145px;
    height:145px;
    position:absolute;
    border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--electric);
    border-right-color:rgba(0,168,255,.3);
    animation:spin 1.3s linear infinite;
}

.loading-text{
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    color:var(--electric-light);
    text-transform:uppercase;
    animation:textPulse 1.5s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{
        transform:scale(.94);
        filter:drop-shadow(0 0 8px rgba(0,168,255,.35));
    }
    50%{
        transform:scale(1.06);
        filter:drop-shadow(0 0 30px rgba(0,168,255,.9));
    }
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

@keyframes textPulse{
    0%,100%{opacity:.45}
    50%{opacity:1}
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%) translateY(-130px);
    z-index:9998;

    min-width:240px;
    max-width:88vw;

    display:flex;
    align-items:center;
    gap:10px;

    padding:11px 18px;

    background:rgba(5,8,12,.97);
    border:1px solid var(--electric);
    border-radius:14px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.7),
        0 0 20px rgba(0,168,255,.12);

    transition:
        transform .4s cubic-bezier(.175,.885,.32,1.275);
}

#toast.show{
    transform:translateX(-50%) translateY(0);
}

#toast.success{border-color:#10b981}
#toast.error{border-color:#ef4444}
#toast.loading{border-color:var(--electric-light)}

.toast-icon{
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:800;
    flex-shrink:0;
}

#toast.success .toast-icon{
    background:#10b981;
    color:#fff;
}

#toast.error .toast-icon{
    background:#ef4444;
    color:#fff;
}

#toast.loading .toast-icon{
    background:var(--electric);
    color:#fff;
    animation:spin .8s linear infinite;
}

.toast-msg{
    font-size:13px;
    font-weight:600;
}

/* =========================
   LAYOUT
========================= */

.container{
    position:relative;
    z-index:2;

    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:16px;
}

.main-card{
    width:100%;
    max-width:430px;

    max-height:92dvh;
    overflow-y:auto;
    overflow-x:hidden;

    padding:clamp(20px,5vw,32px);

    background:var(--card);

    border:1px solid var(--border);
    border-radius:22px;

    backdrop-filter:blur(25px) saturate(150%);
    -webkit-backdrop-filter:blur(25px) saturate(150%);

    box-shadow:
        0 0 0 1px rgba(0,168,255,.05),
        0 0 50px rgba(0,168,255,.16);
}

.main-card::-webkit-scrollbar{
    width:4px;
}

.main-card::-webkit-scrollbar-thumb{
    background:rgba(0,168,255,.45);
    border-radius:10px;
}

.hidden{
    display:none!important;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    width:88px;
    height:88px;
    margin:0 auto 13px;

    border-radius:50%;
    overflow:hidden;

    box-shadow:
        0 0 0 1px rgba(0,168,255,.25),
        0 0 30px rgba(0,168,255,.20);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.app-title{
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;

    background:
        linear-gradient(
            135deg,
            var(--electric),
            var(--electric-light)
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}

.app-subtitle{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

.copyright{
    margin-top:5px;
    color:var(--dim);
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:18px;
}

.form-label{
    display:block;
    margin-bottom:7px;

    font-size:12px;
    font-weight:700;
    color:#d1d5db;
}

.form-input{
    width:100%;

    padding:14px 15px;

    background:rgba(0,0,0,.55);
    color:#fff;

    border:1px solid rgba(0,168,255,.30);
    border-radius:12px;

    font-size:15px;

    transition:.25s;
}

.form-input::placeholder{
    color:#59616d;
}

.form-input:focus{
    outline:none;
    border-color:var(--electric);

    box-shadow:
        0 0 0 3px rgba(0,168,255,.13),
        0 0 20px rgba(0,168,255,.08);
}

/* =========================
   BUTTONS
========================= */

.btn{
    width:100%;

    border:0;
    border-radius:13px;

    padding:14px 20px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    color:#fff;

    font-size:14px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;

    cursor:pointer;
    text-decoration:none;

    transition:.25s;

    -webkit-tap-highlight-color:transparent;
}

.btn:active{
    transform:scale(.97);
}

.btn-primary{
    margin-top:4px;

    background:
        linear-gradient(
            135deg,
            #008cff,
            #00c6ff
        );

    box-shadow:
        0 7px 25px rgba(0,168,255,.35);
}

.btn-primary:hover{
    box-shadow:
        0 8px 30px rgba(0,168,255,.55);
}

.btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.info-box{
    margin-top:18px;
    padding:15px;

    text-align:center;

    background:rgba(0,168,255,.055);
    border:1px solid rgba(0,168,255,.22);
    border-radius:12px;
}

.info-label{
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
}

.info-value{
    margin-top:4px;
    font-size:15px;
    font-weight:800;
    color:var(--electric-light);
}

.info-subtext{
    margin-top:4px;
    color:var(--dim);
    font-size:11px;
}

/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:6px;

    padding:5px;
    margin-bottom:18px;

    background:rgba(0,0,0,.5);
    border:1px solid rgba(0,168,255,.18);
    border-radius:14px;
}

.tab{
    flex:1;

    padding:10px 4px;

    border:0;
    border-radius:10px;

    background:transparent;
    color:#697381;

    cursor:pointer;

    font-size:10px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:.5px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;

    transition:.25s;
}

.tab svg{
    width:18px;
    height:18px;
}

.tab.active{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #008cff,
            #0066ff
        );

    box-shadow:
        0 5px 18px rgba(0,168,255,.35);
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
    animation:fadeUp .25s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   SECTION
========================= */

.section-title{
    display:flex;
    align-items:center;
    gap:8px;

    margin-bottom:12px;

    color:#697381;

    font-size:10px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:2px;
}

.section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,.07);
}

/* =========================
   OPTIONS
========================= */

.feature-item{
    width:100%;
    min-height:85px;

    display:flex;
    align-items:center;
    gap:12px;

    padding:12px;

    margin-bottom:10px;

    background:var(--item);
    border:1px solid var(--item-border);
    border-radius:13px;

    transition:.25s;
}

.feature-item:hover{
    border-color:rgba(0,168,255,.55);

    box-shadow:
        0 0 20px rgba(0,168,255,.07);
}

.feature-icon-wrap{
    width:40px;
    height:40px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    /* Les logos SVG restent les mêmes */
    background:rgba(0,168,255,.10);
}

.feature-icon-wrap svg{
    width:19px;
    height:19px;

    color:var(--electric-light);
}

.feature-info{
    flex:1;
    min-width:0;
}

.feature-title{
    margin-bottom:3px;

    color:var(--text);

    font-size:12px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:.4px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.feature-desc{
    color:var(--muted);

    font-size:11px;
    line-height:1.35;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

/* =========================
   TOGGLE
========================= */

.toggle{
    width:48px;
    height:28px;

    flex-shrink:0;

    position:relative;

    background:#303844;
    border-radius:14px;

    cursor:pointer;

    transition:.3s;
}

.toggle.active{
    background:
        linear-gradient(
            135deg,
            #008cff,
            #00c6ff
        );

    box-shadow:
        0 0 14px rgba(0,168,255,.30);
}

.toggle-thumb{
    position:absolute;

    top:3px;
    left:3px;

    width:22px;
    height:22px;

    background:#fff;
    border-radius:50%;

    box-shadow:0 2px 7px rgba(0,0,0,.4);

    transition:
        transform .3s cubic-bezier(.34,1.56,.64,1);
}

.toggle.active .toggle-thumb{
    transform:translateX(20px);
}

/* =========================
   ACTIVAR
========================= */

.btn-inject{
    margin-top:20px;

    padding:15px 20px;

    font-size:15px;

    background:
        linear-gradient(
            135deg,
            #0077ff,
            #00c6ff
        );

    box-shadow:
        0 8px 30px rgba(0,168,255,.38);
}

.btn-inject:hover{
    box-shadow:
        0 8px 35px rgba(0,168,255,.60);

/* =========================
   LOGOUT
========================= */

.logout-link{
    display:block;

    margin-top:20px;

    text-align:center;

    color:#68707d;

    font-size:13px;

    cursor:pointer;
}

.logout-link:hover{
    color:var(--electric-light);
}
</style>
</head>

<body>

<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const DEFAULT_PASSWORD = "Antijudakeyvi1";
const VALID_DAYS = 30;

const LOGO_URL =
"https://i.postimg.cc/7LmDNT8W/8f4199dd-a211-4077-8132-1af991b36646.jpg";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
document.getElementById("neuralCanvas");

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

const PARTICLES =
Array.from({length:70},()=>({

    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,

    vx:(Math.random()-.5)*.45,
    vy:(Math.random()-.5)*.45,

    r:Math.random()*1.8+.8

}));

function drawNeural(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    PARTICLES.forEach(p=>{

        p.x+=p.vx;
        p.y+=p.vy;

        if(
            p.x<0 ||
            p.x>canvas.width
        ){
            p.vx*=-1;
        }

        if(
            p.y<0 ||
            p.y>canvas.height
        ){
            p.vy*=-1;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "rgba(0,168,255,.7)";

        ctx.fill();

    });

    for(
        let i=0;
        i<PARTICLES.length;
        i++
    ){

        for(
            let j=i+1;
            j<PARTICLES.length;
            j++
        ){

            const dx =
                PARTICLES[i].x -
                PARTICLES[j].x;

            const dy =
                PARTICLES[i].y -
                PARTICLES[j].y;

            const d =
                Math.sqrt(
                    dx*dx+dy*dy
                );

            if(d<140){

                ctx.beginPath();

                ctx.strokeStyle =
                    `rgba(0,168,255,${
                        (1-d/140)*.25
                    })`;

                ctx.lineWidth=1;

                ctx.moveTo(
                    PARTICLES[i].x,
                    PARTICLES[i].y
                );

                ctx.lineTo(
                    PARTICLES[j].x,
                    PARTICLES[j].y
                );

                ctx.stroke();

            }

        }

    }

    requestAnimationFrame(drawNeural);

}

let toastTimer;

function showToast(
    message,
    type="success"
){

    const toast =
        document.getElementById("toast");

    const icon =
        document.getElementById("toastIcon");

    const text =
        document.getElementById("toastMsg");

    toast.className=type;

    icon.textContent =
        type==="success"
        ? "✓"
        : type==="error"
        ? "✕"
        : "↻";

    text.textContent=message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    if(type!=="loading"){

        toastTimer =
            setTimeout(
                ()=>{
                    toast.classList.remove("show");
                },
                3000
            );

    }

}

/* =====================================================

===================================================== */

function buildFeatures(){

    let fHTML="";
    let oHTML="";

    FEATURES.forEach(f=>{

        const html=`

        <div class="feature-item">

            <div class="feature-icon-wrap">
                ${f.svg}
            </div>

            <div class="feature-info">

                <div class="feature-title">
                    ${f.title}
                </div>

                <div class="feature-desc">
                    ${f.desc}
                </div>

            </div>

            <div
                class="toggle"
                data-id="${f.id}"
                role="switch"
                aria-checked="false">

                <div class="toggle-thumb"></div>

            </div>

        </div>`;

        if(f.cat==="features"){
            fHTML+=html;
        }else{
            oHTML+=html;
        }

    });

    document.getElementById(
        "featuresList"
    ).innerHTML=fHTML;

    document.getElementById(
        "optimizationList"
    ).innerHTML=oHTML;

    document.querySelectorAll(
        ".toggle"
    ).forEach(toggle=>{

        toggle.addEventListener(
            "click",
            function(){

                const id =
                    parseInt(
                        this.dataset.id
                    );

                states[id]=!states[id];

                this.classList.toggle(
                    "active"
                );

                this.setAttribute(
                    "aria-checked",
                    states[id]
                );

                showToast(
                    states[id]
                    ? `${FEATURES[id].title} activada`
                    : `${FEATURES[id].title} desactivada`
                );

            }
        );

    });

}

/* =====================================================
   SESSION / 30 DÍAS
===================================================== */

const SESSION_KEY =
"antijuda_session";

let currentSession=null;

function createSession(){

    const expires =
        Date.now() +
        VALID_DAYS *
        24 *
        60 *
        60 *
        1000;

    currentSession={
        expiresAt:expires
    };

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(
            currentSession
        )
    );

}

function restoreSession(){

    const saved =
        localStorage.getItem(
            SESSION_KEY
        );

    if(!saved){
        return false;
    }

    try{

        const session =
            JSON.parse(saved);

        if(
            !session.expiresAt ||
            session.expiresAt<=Date.now()
        ){

            localStorage.removeItem(
                SESSION_KEY
            );

            return false;
        }

        currentSession=session;

        return true;

    }catch{

        localStorage.removeItem(
            SESSION_KEY
        );

        return false;
    }

}


/* =====================================================
   EXPIRATION
===================================================== */

let countdownTimer=null;

function updateExpiration(){

    if(!currentSession){
        return;
    }

    const expiry =
        currentSession.expiresAt;

    const dateEl =
        document.getElementById(
            "expirationDate"
        );

    const daysEl =
        document.getElementById(
            "daysLeft"
        );

    const date =
        new Date(expiry);

    dateEl.textContent =
        date.toLocaleDateString(
            "es-ES"
        ) +
        " · " +
        date.toLocaleTimeString(
            "es-ES",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    tickExpiration(
        expiry,
        daysEl
    );

    if(countdownTimer){
        clearInterval(
            countdownTimer
        );
    }

    countdownTimer =
        setInterval(
            ()=>{
                tickExpiration(
                    expiry,
                    daysEl
                );
            },
            1000
        );

}

function tickExpiration(
    expiry,
    element
){

    const diff =
        expiry-Date.now();

    if(diff<=0){

        element.textContent =
            "Expirada";

        element.style.color =
            "#ef4444";

        logout();

        return;
    }

    const days =
        Math.floor(
            diff/86400000
        );

    const hours =
        Math.floor(
            (diff%86400000)/
            3600000
        );

    const minutes =
        Math.floor(
            (diff%3600000)/
            60000
        );

    const seconds =
        Math.floor(
            (diff%60000)/
            1000
        );

    element.textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s restantes`;

}

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event){

            event.preventDefault();

            const input =
                document.getElementById(
                    "keyInput"
                );

            const password =
                input.value.trim();

            const button =
                document.getElementById(
                    "loginBtn"
                );

            if(!password){

                showToast(
                    "Introduce tu contraseña",
                    "error"
                );

                return;
            }

            button.disabled=true;

            button.textContent =
                "VERIFICANDO...";

            setTimeout(()=>{

                if(
                    password===
                    DEFAULT_PASSWORD
                ){

                    createSession();

                    showToast(
                        "Acceso autorizado",
                        "success"
                    );

                    setTimeout(
                        openApp,
                        700
                    );

                }else{

                    showToast(
                        "Contraseña incorrecta",
                        "error"
                    );

                    button.disabled=false;

                    button.textContent =
                        "ENTRAR";

                }

            },900);

        }
    );


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        SESSION_KEY
    );

    if(countdownTimer){
        clearInterval(
            countdownTimer
        );
    }

    currentSession=null;

    showToast(
        "Sesión cerrada",
        "error"
    );

    setTimeout(
        ()=>{
            location.reload();
        },
        700
    );

}
